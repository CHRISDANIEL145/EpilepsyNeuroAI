[project]
name = "epilepsy-neuro-ai"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "Flask==3.0.0",
    "Werkzeug==3.0.1",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "tensorflow-cpu>=2.8.0",
    "matplotlib>=3.4.0",
    "xlrd>=2.0.0",
    "openpyxl>=3.0.0",
    "joblib>=1.1.0",
    "h5py"
]

[tool.vercel]
entrypoint = "web_app.app:app"
